name: Build Docker Image (x86 only)

on:
  # push:
    # branches: [ club ]
    # paths:
      # - 'Dockerfile'
      # - 'src/**'
      # - '.github/workflows/build-docker.yml'
  # pull_request:
    # branches: [ club ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # 关键：强制使用单一平台构建器，禁用多架构
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=10485760
          buildkitd-flags: --debug
          # 显式指定默认平台为linux/amd64
          platforms: linux/amd64

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dvps
          # 简化标签规则，避免架构相关的自动标签
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/club' }}
          # 关键：禁用自动生成架构标签
          flavor: |
            latest=false
            suffix=amd64,onlatest=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # 1. 强制指定仅x86架构
          platforms: linux/amd64
          # 2. 禁用多架构清单（关键：避免生成unknown架构）
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 3. 强制使用本地构建器，禁用远程
          builder: ${{ steps.setup-buildx.outputs.name }}
          # 4. 禁用缓存的多架构元数据（可选，防止缓存污染）
          cache-from: type=gha,scope=amd64-only
          cache-to: type=gha,scope=amd64-only,mode=max
          # 5. 显式指定输出类型为单一平台
          outputs: type=docker
