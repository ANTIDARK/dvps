# Workflow 名称
name: Build and Push Docker Image

# 触发条件：
# 1. 推送到 main 分支时触发
# 2. 手动触发（便于测试）
# 3. 可选：PR 到 main 分支时仅构建不推送（避免误推送）
on:
  push:
    branches: [ club ]
    # 可选：仅当 Dockerfile 或代码核心目录变更时触发，减少无效构建
    paths:
      - 'Dockerfile'
      - 'src/**'
      - '.github/workflows/build-docker.yml'
  pull_request:
    branches: [ club ]
  workflow_dispatch:  # 手动触发开关

# 定义作业
jobs:
  build:
    runs-on: ubuntu-latest  # 使用最新版 Ubuntu 运行器
    permissions:
      contents: read        # 读取仓库内容权限
      packages: write       # 推送 GHCR 镜像的权限（如需）
    
    steps:
      # 步骤1：检出仓库代码（必须，否则无法访问 Dockerfile）
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：设置 QEMU（可选，支持多架构构建，如 arm64/amd64）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 步骤3：设置 Docker Buildx（增强构建能力，支持多架构、缓存）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤4：登录 Docker 仓库（根据你的镜像仓库选择）
      # 选项A：登录 Docker Hub（需配置 Secrets）
    # - name: Login to Docker Hub
      #  if: github.event_name != 'pull_request'  # PR 时不登录（避免推送）
      #  uses: docker/login-action@v3
      #  with:
      #    username: ${{ secrets.DOCKER_HUB_USERNAME }}
      #    password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 选项B：登录 GitHub Container Registry (GHCR)（可选，二选一或都选）
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # GitHub 自动生成的 token，无需手动配置

      # 步骤5：提取镜像元数据（自动生成标签，如 latest、提交哈希）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 镜像名称（替换为你的仓库名） |
            # your-dockerhub-username/your-repo-name  # Docker Hub 镜像名
          images: ghcr.io/${{ github.repository_owner }}/dvps  # GHCR 镜像名
          # 自动生成标签规则
          tags: |
            type=schedule
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 步骤6：构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # 构建上下文（当前目录，即仓库根目录）
          file: ./Dockerfile  # Dockerfile 路径（如果不在根目录需修改）
          platforms: linux/amd64,linux/arm64  # 构建多架构镜像（可选）
          push: ${{ github.event_name != 'pull_request' }}  # PR 时仅构建不推送
          tags: ${{ steps.meta.outputs.tags }}  # 使用步骤5生成的标签
          labels: ${{ steps.meta.outputs.labels }}  # 自动生成镜像标签
          cache-from: type=gha  # 使用 GitHub Actions 缓存加速构建
          cache-to: type=gha,mode=max  # 保存缓存到 GitHub Actions
