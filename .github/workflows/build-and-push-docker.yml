name: Build Docker Image (x86 only)

on:
  push:
    branches: [ club ]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - '.github/workflows/build-docker.yml'
  pull_request:
    branches: [ club ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 核心：强制使用Node.js 24消除警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 移除QEMU（因为仅构建x86，无需多架构模拟）
      # - name: Set up QEMU  # 注释/删除这一步，x86构建不需要QEMU

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录镜像仓库（根据你的实际需求选择保留/修改）
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dvps
          tags: |
            type=schedule
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/club' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # 关键修改：仅构建x86架构（linux/amd64）
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
